name: Make a copy

on:
  workflow_dispatch:
    inputs:
      payload:
        description: JSON sent by Pages CMS
        required: true

permissions:
  contents: write

concurrency:
  group: duplicate-entry
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy entry
        id: copy
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: node scripts/duplicate-entry.mjs

      - name: Commit
        env:
          TARGET: ${{ steps.copy.outputs.target }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET"
          git commit -m "Create $TARGET as a copy (via Pages CMS)"
          git pull --rebase
          git push
