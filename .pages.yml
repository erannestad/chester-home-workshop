# Pages CMS configuration (https://pagescms.org/docs/configuration/)
# Defines what your mom sees at app.pagescms.org. Edit with care: field `name`s must
# match src/content.config.ts.

# Record who made each edit: commits are authored by the signed-in editor, not the app.
settings:
  commit:
    identity: user
    templates:
      create: "Create {path} by {userName} (via Pages CMS)"
      update: "Update {path} by {userName} (via Pages CMS)"
      delete: "Delete {path} by {userName} (via Pages CMS)"
      rename: "Rename {oldPath} to {newPath} by {userName} (via Pages CMS)"

media:
  - name: products
    label: Product photos
    input: src/assets/products
    # Written into product files relative to src/content/products/, so Astro can
    # optimize the photos (resize + WebP) at build time.
    output: ../../assets/products
    # JPG/PNG/WebP only: the build can't process HEIC, GIF or SVG.
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: journal
    label: Journal photos
    input: src/assets/journal
    output: ../../assets/journal
    # JPG/PNG/WebP only: the build can't process HEIC, GIF or SVG.
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: pages
    label: Page photos
    input: src/assets/pages
    output: ../../assets/pages
    # JPG/PNG/WebP only: the build can't process HEIC, GIF or SVG.
    extensions: [jpg, jpeg, png, webp]
    rename: safe

content:
  # ---------------------------------------------------------------- Products
  - name: products
    label: Products
    type: collection
    path: src/content/products
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [images, title, category, price, status, order, homepage.featured, homepage.journal_priority, homepage.journal_span, in_journal, draft]
      primary: title
      search: [title, summary]
      sort: [title, price, order]
      default:
        sort: title
        order: asc
    actions:
      - name: make-a-copy
        label: Make a copy
        scope: entry
        workflow: duplicate-entry.yml
        cancelable: false
        confirm:
          title: Make a copy of this product
          message: Everything is copied, including photos. The copy starts out hidden from the website, and shows up in the Products list in about a minute. Leave the name blank to call it "(copy)".
          button: Make a copy
        fields:
          - name: title
            label: Name for the copy
            type: text
    fields:
      - name: title
        label: Name
        type: string
        required: true
      - name: images
        label: Photos
        description: The first photo is the main one. Phone photos are fine; the site resizes them.
        type: image
        options:
          media: products
          multiple:
            max: 10
      - name: category
        label: Category
        type: reference
        options:
          collection: categories
          value: "{name}"
          label: "{primary}"
      - name: price
        label: Price ($)
        description: Leave blank for "Price on request".
        type: number
        options:
          min: 0
      - name: price_note
        label: Price note
        description: Optional, e.g. "per yard", "8 oz jar", "Original, 9 × 12 in.", "Quoted per piece".
        type: string
      - name: status
        label: Availability
        type: select
        default: available
        options:
          values:
            - name: available
              label: Available
            - name: made_to_order
              label: Made to order / by quote
            - name: sold_out
              label: Sold
      - name: summary
        label: Short description
        description: One or two sentences. Shown at the top of the product page and in search results.
        type: text
      - name: body
        label: Full description
        type: rich-text
        options:
          format: markdown
          media: false
      - name: details
        label: Details
        description: Optional rows like Material / Linen, Size / 18 × 18 in.
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
          - name: value
            label: Value
            type: string
      - name: order
        label: Sort order
        description: Optional. Lower numbers appear first in the shop.
        type: number
      - name: in_journal
        label: Show in the journal
        description: Adds this product to the home-page journal, in full color (no gray filter). Hidden products never appear, even with this on. This does not change the shop.
        type: boolean
        default: false
      - name: homepage
        label: Homepage settings
        type: object
        fields:
          - name: featured
            label: Feature on homepage
            description: Moves this item toward the top of the shop, so it is easier to find from the home page.
            type: boolean
            default: false
          - name: journal_priority
            label: Priority
            description: When more than one product is in the journal, 1 is first and 10 is last. Products with the same number are listed A to Z. Only used when Show in the journal is on.
            type: select
            default: "5"
            options:
              values:
                - name: "1"
                  label: "1 — first"
                - name: "2"
                  label: "2"
                - name: "3"
                  label: "3"
                - name: "4"
                  label: "4"
                - name: "5"
                  label: "5"
                - name: "6"
                  label: "6"
                - name: "7"
                  label: "7"
                - name: "8"
                  label: "8"
                - name: "9"
                  label: "9"
                - name: "10"
                  label: "10 — last"
          - name: journal_span
            label: Columns
            description: How many columns this product covers in the journal on a wide screen. Most stay at one. Use two or three for a larger photo. Only used when Show in the journal is on.
            type: select
            default: "1"
            options:
              values:
                - name: "1"
                  label: One column
                - name: "2"
                  label: Two columns
                - name: "3"
                  label: Three columns
      - name: draft
        label: Hide from website
        description: Keep this product saved but off the site.
        type: boolean
        default: false

  # ---------------------------------------------------------------- Categories
  - name: categories
    label: Categories
    type: collection
    path: src/content/categories
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, order]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Name
        type: string
        required: true
      - name: summary
        label: Short description
        description: Shown on the home page under "What we make".
        type: text
      - name: body
        label: Category page text
        description: Shown at the top of this category's shop page.
        type: rich-text
        options:
          format: markdown
          media: false
      - name: order
        label: Sort order
        description: Lower numbers appear first.
        type: number

  # ---------------------------------------------------------------- Journal
  - name: journal
    label: Journal
    type: collection
    path: src/content/journal
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [images, title, date, span, draft]
      primary: title
      search: [title]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        description: Newest posts show first on the home page.
        type: date
        required: true
      - name: images
        label: Photos
        description: The first photo is shown large; any others appear as small photos underneath.
        type: image
        options:
          media: journal
          multiple:
            max: 12
      - name: body
        label: Text
        description: A sentence or two about what's in the photos.
        type: rich-text
        options:
          format: markdown
          media: false
      - name: span
        label: Width
        description: How many columns this post covers on a wide screen. Most posts stay at one. Use two or three for a larger photo.
        type: select
        default: "1"
        options:
          values:
            - name: "1"
              label: One column
            - name: "2"
              label: Two columns
            - name: "3"
              label: Three columns
      - name: draft
        label: Hide from website
        description: Keep this post saved but off the site.
        type: boolean
        default: false

  # ---------------------------------------------------------------- Pages
  - name: pages
    label: Pages
    type: group
    items:
      - name: home
        label: Home page
        type: file
        path: src/content/pages/home.md
        format: yaml-frontmatter
        fields:
          - name: title
            type: string
            hidden: true
            default: Home
          - name: heading
            label: Headline
            type: text
          - name: intro
            label: Introduction
            type: text
          - name: image
            label: Large photo
            type: image
            options:
              media: pages
          - name: image_alt
            label: Photo description
            description: A few words describing the photo, for screen readers.
            type: string
          - name: featured_heading
            label: Journal heading
            description: The label above the journal on the home page, e.g. "Journal" or "From the workshop".
            type: string

      - name: about
        label: About page
        type: file
        path: src/content/pages/about.md
        format: yaml-frontmatter
        fields:
          - name: title
            type: string
            hidden: true
            default: About
          - name: heading
            label: Headline
            type: string
          - name: intro
            label: Introduction
            type: text
          - name: body
            label: Text
            type: rich-text
            options:
              format: markdown
              media: false
          - name: image
            label: Photo
            type: image
            options:
              media: pages
          - name: image_alt
            label: Photo description
            type: string

      - name: contact
        label: Contact page
        type: file
        path: src/content/pages/contact.md
        format: yaml-frontmatter
        fields:
          - name: title
            type: string
            hidden: true
            default: Contact
          - name: heading
            label: Headline
            type: string
          - name: intro
            label: Introduction
            type: text
          - name: body
            label: More text (optional)
            type: rich-text
            options:
              format: markdown
              media: false

  # ---------------------------------------------------------------- Settings
  - name: settings
    label: Site settings
    type: file
    path: src/data/settings.json
    format: json
    fields:
      - name: site_name
        label: Business name
        type: string
        required: true
      - name: tagline
        label: Tagline
        description: Used as the default description in search results.
        type: string
      - name: location
        label: Location
        type: string
      - name: email
        label: Email
        type: string
      - name: phone
        label: Phone
        type: string
      - name: instagram
        label: Instagram
        description: "@handle or full link"
        type: string
      - name: facebook
        label: Facebook
        description: Paste the link to the Facebook page, e.g. https://www.facebook.com/chesterhomeworkshop. Leave blank to hide.
        type: string
      - name: announcement
        label: Announcement bar
        description: Optional message shown at the very top of every page, e.g. "Fresh honey is in. Order by Friday for weekend pickup." Leave blank to hide.
        type: string
      - name: ordering_note
        label: Ordering note
        description: Shown under the button on every product page (pickup, shipping, timing).
        type: text
      - name: journal_gray
        label: Gray the journal photos
        description: Tints every journal photo the same warm gray, with a print-like texture. Hovering a post shows the original. On by default. Turn off to use color tints, or full-color photos.
        type: boolean
        default: true
      - name: journal_color
        label: Color the journal photos
        description: Tints each journal post a rusty color (orangy yellow, brown, plum, or green). Only applies when Gray the journal photos is off. Hovering a post shows the original.
        type: boolean
        default: false
