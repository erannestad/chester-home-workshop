# Pages CMS configuration (https://pagescms.org/docs/configuration/)
# Defines what your mom sees at app.pagescms.org. Edit with care: field `name`s must
# match src/content.config.ts.

# Record who made each edit: commits are authored by the signed-in editor, not the app.
settings:
  commit:
    identity: user
    templates:
      create: "Create {path} by {userName} (via Pages CMS)"
      update: "Update {path} by {userName} (via Pages CMS)"
      delete: "Delete {path} by {userName} (via Pages CMS)"
      rename: "Rename {oldPath} to {newPath} by {userName} (via Pages CMS)"

media:
  - name: products
    label: Product photos
    input: src/assets/products
    # Written into product files relative to src/content/products/, so Astro can
    # optimize the photos (resize + WebP) at build time.
    output: ../../assets/products
    # JPG/PNG/WebP only: the build can't process HEIC, GIF or SVG.
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: journal
    label: Journal photos
    input: src/assets/journal
    output: ../../assets/journal
    # JPG/PNG/WebP only: the build can't process HEIC, GIF or SVG.
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: pages
    label: Page photos
    input: src/assets/pages
    output: ../../assets/pages
    # JPG/PNG/WebP only: the build can't process HEIC, GIF or SVG.
    extensions: [jpg, jpeg, png, webp]
    rename: safe

content:
  # ---------------------------------------------------------------- Products
  - name: products
    label: Products
    type: collection
    path: src/content/products
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [images, title, category, price, status, order, homepage.featured, homepage.order, homepage.columns, draft]
      primary: title
      search: [title, summary]
      sort: [title, price, order]
      default:
        sort: title
        order: asc
    actions:
      - name: make-a-copy
        label: Make a copy
        scope: entry
        workflow: duplicate-entry.yml
        cancelable: false
        confirm:
          title: Make a copy of this product
          message: Everything is copied, including photos. The copy starts out hidden from the website, and shows up in the Products list in about a minute. Leave the name blank to call it "(copy)".
          button: Make a copy
        fields:
          - name: title
            label: Name for the copy
            type: text
    fields:
      - name: title
        label: Name
        type: string
        required: true
      - name: images
        label: Photos
        description: The first photo is the main one. Use JPEG, PNG, or WebP under about 3 MB each (phone photos are often too large). In Preview on a Mac: File → Export…, JPEG, quality 70–80, longest side about 2000 px. The site resizes them from there.
        type: image
        options:
          media: products
          multiple:
            max: 10
      - name: category
        label: Category
        type: reference
        options:
          collection: categories
          value: "{name}"
          label: "{primary}"
      - name: price
        label: Price ($)
        description: Leave blank for "Price on request".
        type: number
        options:
          min: 0
      - name: price_note
        label: Price note
        description: Optional, e.g. "per yard", "8 oz jar", "Original, 9 × 12 in.", "Quoted per piece".
        type: string
      - name: status
        label: Availability
        type: select
        default: available
        options:
          values:
            - name: available
              label: Available
            - name: made_to_order
              label: Made to order / by quote
            - name: sold_out
              label: Sold
      - name: summary
        label: Short description
        description: One or two sentences. Shown at the top of the product page and in search results.
        type: text
      - name: body
        label: Full description
        type: rich-text
        options:
          format: markdown
          media: false
      - name: details
        label: Details
        description: New products start with Dimensions, Material, and Year, set up for watercolors. Change or delete a row if it does not apply.
        type: object
        list: true
        default:
          - label: Dimensions
            value: ""
          - label: Material
            value: watercolor on paper, mounted on panel
          - label: Year
            value: ""
        fields:
          - name: label
            label: Label
            type: string
          - name: value
            label: Value
            type: string
      - name: order
        label: Sort order
        description: Optional. Lower numbers appear first in the shop.
        type: number
      - name: homepage
        label: Feature on homepage
        description: Turn on to put this product in the journal on the home page, in full color. Then set its order and width. Hidden products never appear, even with this on. This does not change the shop.
        type: object
        fields:
          - name: featured
            label: Feature on homepage
            type: boolean
            default: false
          - name: order
            label: Order on homepage
            description: 1 is earlier (closer to the top) and 5 is later. Products with the same number are listed A to Z. Only used when Feature on homepage is on.
            type: select
            default: "3"
            options:
              values:
                - name: "1"
                  label: "1 — first"
                - name: "2"
                  label: "2"
                - name: "3"
                  label: "3"
                - name: "4"
                  label: "4"
                - name: "5"
                  label: "5 — last"
          - name: columns
            label: Columns on homepage
            description: How many columns this product covers on a wide screen. Most stay at one. Use two or three for a larger photo. On a phone it is always one column. Only used when Feature on homepage is on.
            type: select
            default: "1"
            options:
              values:
                - name: "1"
                  label: One column
                - name: "2"
                  label: Two columns
                - name: "3"
                  label: Three columns
          - name: more_photos
            label: Show more photos on homepage
            description: Off shows only the first photo. On adds up to four small photos underneath, like a journal post. Only used when Feature on homepage is on.
            type: boolean
            default: false
      - name: draft
        label: Hide from website
        description: Keep this product saved but off the site.
        type: boolean
        default: false

  # ---------------------------------------------------------------- Categories
  - name: categories
    label: Categories
    type: collection
    path: src/content/categories
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, order]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Name
        type: string
        required: true
      - name: summary
        label: Short description
        description: Shown on the home page under "What we make".
        type: text
      - name: body
        label: Category page text
        description: Shown at the top of this category's shop page.
        type: rich-text
        options:
          format: markdown
          media: false
      - name: order
        label: Sort order
        description: Lower numbers appear first.
        type: number

  # ---------------------------------------------------------------- Journal
  - name: journal
    label: Journal
    type: collection
    path: src/content/journal
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [images, title, date, span, draft]
      primary: title
      search: [title]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        description: Newest posts show first on the home page.
        type: date
        required: true
      - name: images
        label: Photos
        description: The first photo is shown large; any others appear as small photos underneath. Use JPEG, PNG, or WebP under about 3 MB each (phone photos are often too large). In Preview on a Mac: File → Export…, JPEG, quality 70–80, longest side about 2000 px.
        type: image
        options:
          media: journal
          multiple:
            max: 12
      - name: body
        label: Text
        description: A sentence or two about what's in the photos.
        type: rich-text
        options:
          format: markdown
          media: false
      - name: span
        label: Width
        description: How many columns this post covers on a wide screen. Most posts stay at one. Use two or three for a larger photo.
        type: select
        default: "1"
        options:
          values:
            - name: "1"
              label: One column
            - name: "2"
              label: Two columns
            - name: "3"
              label: Three columns
      - name: draft
        label: Hide from website
        description: Keep this post saved but off the site.
        type: boolean
        default: false

  # ---------------------------------------------------------------- Pages
  - name: pages
    label: Pages
    type: group
    items:
      - name: home
        label: Home page
        type: file
        path: src/content/pages/home.md
        format: yaml-frontmatter
        fields:
          - name: title
            type: string
            hidden: true
            default: Home
          - name: heading
            label: Headline
            type: text
          - name: intro
            label: Introduction
            type: text
          - name: image
            label: Large photo
            description: JPEG, PNG, or WebP under about 3 MB. Phone photos are often too large. In Preview: File → Export…, JPEG, quality 70–80, longest side about 2000 px.
            type: image
            options:
              media: pages
          - name: image_alt
            label: Photo description
            description: A few words describing the photo, for screen readers.
            type: string
          - name: featured_heading
            label: Journal heading
            description: The label above the journal on the home page, e.g. "Journal" or "From the workshop".
            type: string

      - name: about
        label: About page
        type: file
        path: src/content/pages/about.md
        format: yaml-frontmatter
        fields:
          - name: title
            type: string
            hidden: true
            default: About
          - name: heading
            label: Headline
            type: string
          - name: intro
            label: Introduction
            type: text
          - name: body
            label: Text
            type: rich-text
            options:
              format: markdown
              media: false
          - name: image
            label: Photo
            description: JPEG, PNG, or WebP under about 3 MB. Phone photos are often too large. In Preview: File → Export…, JPEG, quality 70–80, longest side about 2000 px.
            type: image
            options:
              media: pages
          - name: image_alt
            label: Photo description
            type: string

      - name: contact
        label: Contact page
        type: file
        path: src/content/pages/contact.md
        format: yaml-frontmatter
        fields:
          - name: title
            type: string
            hidden: true
            default: Contact
          - name: heading
            label: Headline
            type: string
          - name: intro
            label: Introduction
            type: text
          - name: body
            label: More text (optional)
            type: rich-text
            options:
              format: markdown
              media: false

  # ---------------------------------------------------------------- Settings
  - name: settings
    label: Site settings
    type: file
    path: src/data/settings.json
    format: json
    fields:
      - name: site_name
        label: Business name
        type: string
        required: true
      - name: tagline
        label: Tagline
        description: Used as the default description in search results.
        type: string
      - name: location
        label: Location
        type: string
      - name: email
        label: Email
        type: string
      - name: phone
        label: Phone
        type: string
      - name: instagram
        label: Instagram
        description: "@handle or full link"
        type: string
      - name: facebook
        label: Facebook
        description: Paste the link to the Facebook page, e.g. https://www.facebook.com/chesterhomeworkshop. Leave blank to hide.
        type: string
      - name: announcement
        label: Announcement bar
        description: Optional message shown at the very top of every page, e.g. "Fresh honey is in. Order by Friday for weekend pickup." Leave blank to hide.
        type: string
      - name: ordering_note
        label: Ordering note
        description: Shown under the button on every product page (pickup, shipping, timing).
        type: text
      - name: journal_photos
        label: Journal photos
        description: "How journal photos look on the home page. Full color: the photos as they are. Tint: each post gets a rusty color (orangy yellow, brown, plum, or green). Grayscale: every photo the same warm gray, with a print-like texture. With Tint or Grayscale, hovering a post shows the original. Featured products are always in full color."
        type: select
        default: gray
        options:
          values:
            - name: color
              label: Full color
            - name: tint
              label: Tint
            - name: gray
              label: Grayscale
      - name: journal_divider
        label: Divide the journal by
        description: "Where the journal draws a line between groups of posts. By month: Summer is June to August, Fall is September to November, Winter is December to February, Spring is March to May, shown as Fall 2026 (or Winter 2025–26). By solstice: a new line at each one, June 21 and December 21, shown as 2026 Summer Solstice or 2025 Winter Solstice."
        type: select
        default: solstices
        options:
          values:
            - name: year
              label: Year (2025)
            - name: months
              label: Season, by month (Fall 2026)
            - name: solstices
              label: Solstice (2026 Summer Solstice)
